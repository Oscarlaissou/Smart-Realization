# La base de données est sur Supabase (voir backend/.env) : pas de PostgreSQL local.
# Ce fichier ne lance que le broker MQTT local, facultatif (les capteurs peuvent aussi
# utiliser un broker public, voir MQTT_HOST dans backend/.env).
services:
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: [./mosquitto.conf:/mosquitto/config/mosquitto.conf]
